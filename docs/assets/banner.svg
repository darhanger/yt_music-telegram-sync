<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">YT Music Telegram Sync</title>
  <desc id="desc">Last.fm now playing to Telegram Music on Profile</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff0033"/>
      <stop offset="1" stop-color="#2aabee"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <circle cx="92" cy="76" r="150" fill="#ff0033" opacity="0.08"/>
  <circle cx="1110" cy="305" r="190" fill="#2aabee" opacity="0.09"/>
  <g opacity="0.18" fill="none" stroke="#94a3b8">
    <path d="M0 292 C190 220 340 348 535 280 S890 214 1200 290"/>
    <path d="M0 315 C205 245 360 364 560 303 S900 240 1200 312"/>
  </g>
  <g transform="translate(86 88)">
    <circle cx="92" cy="92" r="82" fill="#ff0033"/>
    <circle cx="92" cy="92" r="47" fill="#111827"/>
    <circle cx="92" cy="92" r="15" fill="#f8fafc"/>
    <path d="M71 31 A65 65 0 0 1 145 69" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
  </g>
  <path d="M300 180 H410" stroke="url(#wave)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M391 161 L414 180 L391 199" fill="none" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(930 88)">
    <circle cx="92" cy="92" r="82" fill="#2aabee"/>
    <path d="M46 87 L139 50 C148 47 154 54 151 64 L130 145 C128 154 119 157 112 151 L83 128 L69 142 C66 145 61 143 61 137 L63 111 L124 68 L51 96 C43 99 39 90 46 87Z" fill="#fff"/>
  </g>
  <path d="M790 180 H900" stroke="url(#wave)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M881 161 L904 180 L881 199" fill="none" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <g text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">
    <text x="600" y="130" fill="#f8fafc" font-size="45" font-weight="700">YT Music → Telegram</text>
    <text x="600" y="181" fill="#cbd5e1" font-size="25">Last.fm now playing bridge</text>
    <g transform="translate(468 220)">
      <rect width="264" height="48" rx="24" fill="#ffffff" opacity="0.08"/>
      <circle cx="28" cy="24" r="6" fill="#22c55e"/>
      <text x="143" y="32" fill="#e2e8f0" font-size="19">Music on Profile</text>
    </g>
  </g>
