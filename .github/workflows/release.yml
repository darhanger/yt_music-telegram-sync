name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and development tools
        run: python -m pip install --upgrade pip ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Type-check
        run: python -m mypy src

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Check dependencies
        run: python -m pip check

  release:
    name: Build and publish
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip .

      - name: Verify version
        shell: pwsh
        run: |
          $packageVersion = python -c "from yt_music_telegram_sync import __version__; print(__version__)"
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          if ($packageVersion -ne $tagVersion) {
            throw "Tag $tagVersion does not match package version $packageVersion"
          }
          "RELEASE_VERSION=$packageVersion" >> $env:GITHUB_ENV

      - name: Build release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          python -m pip wheel --no-deps --wheel-dir dist .
          $archive = "dist/yt-music-telegram-sync-v$env:RELEASE_VERSION.zip"
          git archive --format=zip --prefix="yt-music-telegram-sync-v$env:RELEASE_VERSION/" --output=$archive HEAD
          if ($LASTEXITCODE -ne 0) { throw "Unable to build source archive" }
          "RELEASE_ARCHIVE=$archive" >> $env:GITHUB_ENV

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = @($env:RELEASE_ARCHIVE)
          $assets += Get-ChildItem -Path dist -Filter "*.whl" | ForEach-Object FullName
          gh release create "${{ github.ref_name }}" @assets --verify-tag --generate-notes --title "YT Music Telegram Sync v$env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw "Unable to publish GitHub Release" }
