name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and development tools
        run: python -m pip install --upgrade pip ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Type-check
        run: python -m mypy src

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Check dependencies
        run: python -m pip check

  release:
    name: Build and publish
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip .

      - name: Verify version
        shell: pwsh
        run: |
          $packageVersion = python -c "from yt_music_telegram_sync import __version__; print(__version__)"
          $isTag = "${{ github.ref_type }}" -eq "tag"
          if ($isTag) {
            $tagVersion = "${{ github.ref_name }}".TrimStart("v")
            if ($packageVersion -ne $tagVersion) {
              throw "Tag $tagVersion does not match package version $packageVersion"
            }
            $releaseTag = "${{ github.ref_name }}"
            $releaseTitle = "YT Music Telegram Sync v$packageVersion"
            $releasePrerelease = "false"
          }
          else {
            $releaseTag = "v$packageVersion-build.${{ github.run_number }}.${{ github.run_attempt }}"
            $releaseTitle = "YT Music Telegram Sync v$packageVersion build ${{ github.run_number }}.${{ github.run_attempt }}"
            $releasePrerelease = "true"
          }
          "RELEASE_VERSION=$packageVersion" >> $env:GITHUB_ENV
          "RELEASE_TAG=$releaseTag" >> $env:GITHUB_ENV
          "RELEASE_TITLE=$releaseTitle" >> $env:GITHUB_ENV
          "RELEASE_PRERELEASE=$releasePrerelease" >> $env:GITHUB_ENV

      - name: Build release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          python -m pip wheel --no-deps --wheel-dir dist .
          $archive = "dist/yt-music-telegram-sync-$env:RELEASE_TAG.zip"
          git archive --format=zip --prefix="yt-music-telegram-sync-$env:RELEASE_TAG/" --output=$archive HEAD
          if ($LASTEXITCODE -ne 0) { throw "Unable to build source archive" }
          "RELEASE_ARCHIVE=$archive" >> $env:GITHUB_ENV

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = @($env:RELEASE_ARCHIVE)
          $assets += Get-ChildItem -Path dist -Filter "*.whl" | ForEach-Object FullName
          $arguments = @(
            "release", "create", $env:RELEASE_TAG,
            "--generate-notes",
            "--title", $env:RELEASE_TITLE
          )
          if ($env:RELEASE_PRERELEASE -eq "true") {
            $arguments += @("--prerelease", "--target", "${{ github.sha }}")
          }
          else {
            $arguments += "--verify-tag"
          }
          $arguments += $assets
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "Unable to publish GitHub Release" }
