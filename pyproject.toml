[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-music-telegram-sync"
version = "1.0.0"
description = "Sync Last.fm now playing tracks to Telegram Music on Profile"
readme = "README.md"
requires-python = ">=3.11"
license = "Unlicense"
keywords = ["lastfm", "telegram", "youtube-music", "now-playing", "telethon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "httpx>=0.27,<1",
    "mutagen>=1.47,<2",
    "Pillow>=10,<13",
    "pystray>=0.19.5,<1",
    "Telethon>=1.42,<2",
    "yt-dlp>=2025.1.15",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14,<2",
    "ruff>=0.9,<1",
]

[project.scripts]
yt-music-telegram-sync = "yt_music_telegram_sync.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
